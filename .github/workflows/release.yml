name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Sync Python build environment
        run: uv sync --frozen --group backend-build

      - name: Build PyInstaller sidecar
        working-directory: webapp/backend
        run: uv run --project ../.. --group backend-build pyinstaller main.spec

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Build frontend
        working-directory: webapp/frontend
        run: |
          bun install
          bun run build

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Pass 1: create the GitHub release, upload online installer + latest.json
      - name: Build online installer + create release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Jominy ${{ github.ref_name }}"
          releaseBody: |
            Windows desktop installer for the Jominy hardenability predictor.

            **First install** — pick one:
            - `*-setup.exe` — online installer (~5 MB, downloads WebView2 if needed)
            - `*-setup-offline.exe` — offline installer (~150 MB, WebView2 bundled)

            Windows may show a SmartScreen warning — click "More info → Run anyway".

            **Update**: if you already have Jominy installed, the app will detect this release
            and prompt you to update automatically on next launch.
          releaseDraft: false
          prerelease: false
          projectPath: src-tauri
          includeUpdaterJson: true

      # Pass 2: rebuild with offlineInstaller (Rust cache keeps this fast)
      - name: Build offline installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        working-directory: src-tauri
        shell: pwsh
        run: |
          bunx "@tauri-apps/cli@2" build `
            --config '{"bundle":{"windows":{"webviewInstallMode":{"type":"offlineInstaller"}}}}'

      - name: Upload offline installer to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $src = "src-tauri/target/release/bundle/nsis/jominy_${version}_x64-setup.exe"
          $dst = "src-tauri/target/release/bundle/nsis/jominy_${version}_x64-setup-offline.exe"
          Move-Item $src $dst
          gh release upload $env:TAG_NAME $dst --clobber
