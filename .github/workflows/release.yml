name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller fastapi uvicorn pandas pyarrow scikit-learn xgboost joblib pydantic

      - name: Build PyInstaller sidecar
        working-directory: webapp/backend
        run: pyinstaller main.spec

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Build frontend
        working-directory: webapp/frontend
        run: |
          bun install
          bun run build

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build and bundle (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Jominy ${{ github.ref_name }}"
          releaseBody: |
            Windows desktop installer for the Jominy hardenability predictor.

            **First install**: download `Jominy_Setup_*.exe` and run it.
            Windows may show a SmartScreen warning — click "More info → Run anyway".

            **Update**: if you already have Jominy installed, the app will detect this release
            and prompt you to update automatically on next launch.
          releaseDraft: false
          prerelease: false
          projectPath: src-tauri
          includeUpdaterJson: true
